<!DOCTYPE html>
<html lang="es" class="bh-remote-chrome">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - BuenoHotel Eventos</title>
  <link rel="stylesheet" href="styles.css?v=20260923c">
  <link rel="stylesheet" href="https://buenohotel.com/css/site-chrome.css?v=20260926x">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <!-- Favicon / App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo/icono-buenohotel.png?v=20260926m">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/logo-32.png?v=20260921j">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logo/logo-32.png?v=20260921j">
  <link rel="shortcut icon" href="assets/logo/logo-32.png?v=20260921j">
  <style>
    body { background: #f4f4f4; font-family: Roboto, Arial, Helvetica, sans-serif; margin:0; }
    .main-content { min-height: calc(100vh - 200px); display:flex; align-items:center; justify-content:center; padding:40px 20px; }
    .auth-container { max-width:520px; width:100%; background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 20px rgba(0,0,0,.08); border:1px solid #eee; }
    .auth-title { text-align:center; color:#222; margin-bottom:8px; font-size:1.8rem; font-weight:800; }
    .auth-subtitle { text-align:center; color:#555; margin-bottom:24px; font-size:0.98rem; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; margin-bottom:8px; color:#444; font-weight:600; }
    .form-control { width:100%; padding:14px 16px; border:1px solid #ddd; border-radius:6px; font-size:1rem; }
    .form-control:focus { border-color:#FBB03B; outline:none; box-shadow:0 0 0 2px rgba(251,176,59,.2); }
    .btn-primary { display:inline-flex; align-items:center; justify-content:center; background:#fbb03b; color:#222; border:none; padding:10px 22px; border-radius:20px; font-weight:700; font-size:0.98rem; font-family:Arial, Helvetica, sans-serif; cursor:pointer; width:100%; transition:.2s; }
    .btn-primary:hover { background:#e19a2e; color:#222; }
    .btn-primary:hover { background:#e6a02c; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .auth-footer { text-align:center; margin-top:16px; color:#666; }
    .auth-footer a { color:#FBB03B; font-weight:700; text-decoration:none; }
    .auth-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <script src="js/auth.js?v=20260923c"></script>
  <script src="https://buenohotel.com/js/config.js?v=20260929a"></script>
  <script src="https://buenohotel.com/js/i18n.js?v=20261002a"></script>
  <script src="https://buenohotel.com/js/site-shell.js?v=20261002a"></script>
  <script src="js/navbar.js?v=20260919m"></script>

  <div class="main-content">
    <div class="auth-container">
      <h1 class="auth-title">¿Olvidaste tu contraseña?</h1>
      <p class="auth-subtitle">Ingresa tu correo y, si existe una cuenta asociada, te enviaremos un enlace para restablecer tu contraseña.</p>
      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" class="form-control" required placeholder="tucorreo@ejemplo.com" autocomplete="email">
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Enviar enlace</button>
      </form>
      <p class="auth-footer" style="margin-top:20px;">
        <a href="login.html">Volver a iniciar sesión</a>
      </p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const form = document.getElementById('forgotForm');
      const btn = document.getElementById('submitBtn');

      form.addEventListener('submit', async function(e){
        e.preventDefault();
        const email = (document.getElementById('email').value || '').trim().toLowerCase();
        if (!email) {
          showToast({ title:'Correo requerido', message:'Ingresa tu correo electrónico', type:'error', duration:2200 });
          return;
        }
        const original = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = 'Enviando…';
        try {
          const { success, message } = await window.requestPasswordReset(email);
          if (success) {
            showToast({ title:'Enlace enviado', message: message || 'Si el correo existe, recibirás un enlace de restablecimiento en pocos minutos.', type:'success', duration:3600 });
          } else {
            showToast({ title:'Aviso', message: message || 'Si el correo existe, recibirás un enlace de restablecimiento.', type:'error', duration:3200 });
          }
        } catch (err) {
          showToast({ title:'Error', message: err?.message || 'No se pudo procesar tu solicitud', type:'error', duration:3000 });
        } finally {
          btn.disabled = false; btn.innerHTML = original;
        }
      });
    });
  </script>
</body>
</html>

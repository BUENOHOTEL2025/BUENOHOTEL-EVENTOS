  <script>
    // ======================
    // Helpers básicos
    // ======================
    function dGet(val) {
      if (val && typeof val === 'object') {
        if ('S' in val) return val.S;
        if ('N' in val) return Number(val.N);
        if ('BOOL' in val) return !!val.BOOL;
        if ('L' in val) return val.L.map(dGet);
        if ('M' in val) {
          const out = {};
          for (const k in val.M) { out[k] = dGet(val.M[k]); }
          return out;
        }
      }
      return val;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('es-DO', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    /** YYYY-MM-DD desde Dynamo, ISO o texto; evita desfase si ya es date-only */
    function toDateOnlyIso(v) {
      if (v == null || v === '') return '';
      const s = String(dGet(v) || v).trim();
      if (!s) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (s.includes('T')) return s.split('T')[0];
      const d = new Date(s);
      if (isNaN(d.getTime())) return '';
      return d.toISOString().slice(0, 10);
    }

    function addCalendarDaysIso(iso, deltaDays) {
      if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1, (d || 1) + deltaDays, 12, 0, 0);
      if (isNaN(dt.getTime())) return iso;
      const yy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function compareIsoDate(a, b) {
      if (!a || !b) return 0;
      return a < b ? -1 : a > b ? 1 : 0;
    }

    function canonicalEventRangeFromPlain(plain) {
      const startRaw = dGet(plain.fecha_inicio) || dGet(plain.fechaInicio) || dGet(plain.fecha) || '';
      const endRaw = dGet(plain.fecha_fin) || dGet(plain.fechaFin) || dGet(plain.fechaSalida) || '';
      let start = toDateOnlyIso(startRaw);
      let end = toDateOnlyIso(endRaw);
      if (!start && !end) return { start: '', end: '' };
      if (!start) start = end;
      if (!end) end = start;
      if (compareIsoDate(start, end) > 0) {
        const t = start;
        start = end;
        end = t;
      }
      return { start, end };
    }

    let EVENT_FECHAS_MAP = {};

    function buildEventosFechasMap(eventos) {
      const map = {};
      (eventos || []).forEach((raw) => {
        const plain = dGet(raw) || raw;
        const id =
          raw && typeof raw.id === 'object' && raw.id.S
            ? raw.id.S
            : plain.id || plain.eventoId || '';
        if (!id) return;
        const range = canonicalEventRangeFromPlain(plain);
        const diasAntes = parseInt(String(dGet(plain.dias_antes_entrada) || '0'), 10) || 0;
        const diasDespues = parseInt(String(dGet(plain.dias_despues_salida) || '0'), 10) || 0;
        map[id] = {
          fechaInicio: range.start,
          fechaFin: range.end,
          diasAntes,
          diasDespues
        };
      });
      return map;
    }

    /**
     * Fechas mostradas al cliente: siempre alineadas al evento actual del catálogo (panel admin).
     * Solo se conservan fechas del registro si el evento permite ventana (días antes/después) y caen en rango válido.
     */
    function applyResolvedFechas(it) {
      if (!it) return it;
      const eventId = it.eventId || '';
      const ev = EVENT_FECHAS_MAP[eventId];
      let det = it.detalles || {};
      if (det && typeof det === 'object' && det.M) det = dGet(det);
      if (!det || typeof det !== 'object') det = {};

      const regIn = toDateOnlyIso(det.fechaEntrada || det.checkIn || det.fecha_entrada);
      const regOut = toDateOnlyIso(det.fechaSalida || det.checkOut || det.fecha_salida);

      if (!ev || (!ev.fechaInicio && !ev.fechaFin)) {
        it.fechaEntrada = regIn || it.fechaEntrada || '';
        it.fechaSalida = regOut || it.fechaSalida || '';
        return it;
      }

      const evIn = ev.fechaInicio || ev.fechaFin;
      const evOut = ev.fechaFin || ev.fechaInicio || evIn;

      let entrada = evIn;
      let salida = evOut;

      if (ev.diasAntes > 0 && regIn) {
        const minIn = addCalendarDaysIso(evIn, -ev.diasAntes);
        if (compareIsoDate(regIn, minIn) >= 0 && compareIsoDate(regIn, evIn) <= 0) entrada = regIn;
      }

      if (ev.diasDespues > 0 && regOut) {
        const maxOut = addCalendarDaysIso(evOut, ev.diasDespues);
        if (compareIsoDate(regOut, evOut) >= 0 && compareIsoDate(regOut, maxOut) <= 0) salida = regOut;
      }

      it.fechaEntrada = entrada;
      it.fechaSalida = salida;
      return it;
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
    }

    function facturaBorradorUrl(registroId) {
      const rid = String(registroId || '').trim();
      if (!rid) return '#';
      let base = 'https://core-api.buenohotel.com.do';
      try {
        if (window.getAuthApiBase) {
          const b = window.getAuthApiBase();
          if (b) base = String(b).replace(/\/$/, '');
        }
      } catch (_) {}
      return `${base}/api/registrations/${encodeURIComponent(rid)}/factura-borrador?formato=html`;
    }

    function toastComprobante(title, message, type, duration) {
      try {
        if (window.showToast) {
          window.showToast({ title, message, type: type || 'info', duration: duration || 4500 });
          return;
        }
      } catch (_) {}
      alert(message);
    }

    const MSG_COMPROBANTE_NO_LISTO = 'Tu comprobante fiscal aún no está listo. Administración lo publica aquí cuando lo configure y genere.';

    function comprobanteLiberadoParaCliente(dDet) {
      if (!dDet || typeof dDet !== 'object') return false;
      const detalles = dDet.M ? dGet(dDet) : dDet;
      if (!detalles || typeof detalles !== 'object') return false;
      const flag = (raw) => {
        const v = dGet(raw);
        const val = v !== undefined && v !== null ? v : raw;
        return val === true || val === 'true' || String(val).toLowerCase() === 'on';
      };
      return flag(detalles.permite_ver_comprobante_cliente) && flag(detalles.comprobanteGeneradoPorAdmin);
    }

    window.consultarComprobanteCliente = function consultarComprobanteCliente(registroId, listo) {
      const rid = String(registroId || '').trim();
      if (!rid) {
        toastComprobante('Comprobante fiscal', 'No encontramos este registro.', 'error');
        return;
      }
      // Siempre consultar el API: si admin ya habilitó, el cliente debe verla
      // aunque la lista de reservas aún no tenga el flag actualizado.
      openFacturaBorradorHtml(rid);
    };

    async function openFacturaBorradorHtml(registroId) {
      const rid = String(registroId || '').trim();
      if (!rid) return;
      if (!window.auth || !window.auth.isAuthenticated || !window.auth.isAuthenticated()) {
        toastComprobante('Inicia sesión', 'Inicia sesión para ver tu comprobante fiscal.', 'warning');
        return;
      }
      toastComprobante('Comprobante fiscal', 'Abriendo el documento generado por administración…', 'info', 2500);
      const token = window.auth.getAuthToken();
      const bases = getApiBaseCandidates();
      let lastErr = null;
      for (const base of bases) {
        try {
          const url = `${base}/api/registrations/${encodeURIComponent(rid)}/factura-borrador?formato=html`;
          const resp = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
          const ct = String(resp.headers.get('content-type') || '');
          if (resp.status === 401) {
            toastComprobante('Inicia sesión', 'Inicia sesión para ver tu comprobante fiscal.', 'warning');
            return;
          }
          if (resp.status === 403 || resp.status === 404) {
            let msg = MSG_COMPROBANTE_NO_LISTO;
            if (ct.includes('json')) {
              const data = await resp.json().catch(() => null);
              if (data?.message) msg = String(data.message);
            }
            toastComprobante('Comprobante fiscal', msg, 'warning', 6500);
            return;
          }
          if (!resp.ok) {
            lastErr = new Error(`HTTP ${resp.status}`);
            continue;
          }
          const html = await resp.text();
          if (String(html || '').trim().startsWith('{')) {
            try {
              const data = JSON.parse(html);
              toastComprobante('Comprobante fiscal', data.message || MSG_COMPROBANTE_NO_LISTO, 'warning', 6500);
            } catch (_) {
              toastComprobante('Comprobante fiscal', MSG_COMPROBANTE_NO_LISTO, 'warning', 6500);
            }
            return;
          }
          const modal = document.getElementById('factura-preview-modal');
          const frame = document.getElementById('factura-preview-frame');
          const st = document.getElementById('factura-preview-state');
          const btnClose = document.getElementById('factura-preview-close');
          const btnPrint = document.getElementById('factura-preview-print');
          const btnDl = document.getElementById('factura-preview-download');
          if (!modal || !frame || !btnClose || !btnPrint || !btnDl) {
            toastComprobante('Comprobante fiscal', 'No se pudo abrir el documento.', 'error');
            return;
          }
          st.style.display = 'block';
          st.textContent = 'Puedes imprimir, guardar como PDF (Imprimir → Guardar como PDF) o descargar el archivo para enviarlo por correo o WhatsApp.';
          modal.style.display = 'block';
          document.body.classList.add('modal-open');
          frame.srcdoc = html;
          toastComprobante('Comprobante listo', 'Este es tu comprobante fiscal (configurado por administración).', 'success', 4000);

          const close = () => {
            modal.style.display = 'none';
            document.body.classList.remove('modal-open');
            try { frame.srcdoc = '<!doctype html><html><body></body></html>'; } catch(_) {}
          };

          function downloadFacturaCliente() {
            const blob = new Blob([html || ''], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `comprobante-${rid}.html`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (_) {} }, 1500);
          }

          const btnWaShare = document.getElementById('factura-preview-whatsapp');
          btnClose.onclick = close;
          btnPrint.onclick = () => { try { frame.contentWindow && frame.contentWindow.print(); } catch(_) {} };
          btnDl.onclick = () => {
            downloadFacturaCliente();
            toastComprobante('Descargado', 'Archivo listo. Para PDF usa Imprimir → Guardar como PDF. Puedes adjuntarlo en correo o WhatsApp.', 'success', 5000);
          };
          if (btnWaShare) {
            btnWaShare.onclick = () => {
              downloadFacturaCliente();
              const msg = 'Te comparto el comprobante fiscal de BuenoHotel Eventos. Adjunto el archivo que acabo de descargar.';
              window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
            };
          }
          return;
        } catch (e) {
          lastErr = e;
          continue;

    function normalizeReserva(r){
      const nombre = (r?.detalles?.eventoNombre) || r?.eventoNombre || r?.eventName || r?.eventId || r?.eventoId || 'Evento';

    function sumMontos(pagos){
      try { return (pagos||[]).reduce((acc,p)=> acc + Number(p?.monto||0), 0); } catch(_) { return 0; }

    function groupByEvent(items){
      const map = {};
      for (const it of items){
        const key = it.eventId || it.id;
        if (!map[key]) { map[key] = { ...it, pagos: [...(it.pagos||[])] }; }
        else {
          map[key].pagos = [...map[key].pagos, ...(it.pagos||[])];
          // Mantén la fecha más antigua como fecha de registro visual
          try {
            const a = new Date(map[key].fecha).getTime();
            const b = new Date(it.fecha).getTime();
            if (!isNaN(b) && (isNaN(a) || b < a)) map[key].fecha = it.fecha;
          } catch(_) {}
        }
      }
      return Object.values(map);
    }

    async function maybeRecomputeEstado(it, aprobado, montoTotal){
      try {
        const pagos = Array.isArray(it.pagos) ? it.pagos : [];
        const pendiente = pagos
          .filter(p => String(p?.estado||'').toLowerCase()==='pendiente')
          .reduce((s,p)=> s + Number(p?.monto||0), 0);
        const hipotetico = aprobado + pendiente;
        if (!(hipotetico >= montoTotal && montoTotal > 0)) return;
        const prev = String(it.estado||'').toLowerCase();
        if (prev === 'pago' || prev === 'confirmado' || prev === 'confirmada') return;
        if (!window.auth || !window.auth.isAuthenticated || !window.auth.isAuthenticated()) return;
        const token = window.auth.getAuthToken();
        const bases = getApiBaseCandidates();
        let updated = null; let lastErr = null;
        for (const base of bases){
          try{
            const idOrCode = it.id || it.codigo || it.codigoCorto || '';
            const { resp, data } = await fetchJson(`${base}/api/registrations/${encodeURIComponent(idOrCode)}/recompute-estado`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!resp.ok) throw new Error(data?.message || `HTTP ${resp.status}`);
            updated = data?.data || null;
            break;
          } catch(e){ lastErr = e; continue; }
        }
        if (!updated) return;
        // Actualizar objeto y UI del modal
        it.estado = updated.estado || it.estado;
        const span = document.getElementById('estado-actual');
        if (span){
          span.textContent = escapeHtml(formatEstadoLabel(it.estado));
          span.className = mapEstadoClass(it.estado);
        }
      } catch(_){ /* sin romper UI */ }
    }

    let EVENT_MONEDA_MAP = {};
    function buildEventosMonedaMap(eventos){

    // Mapa de configuración de precios por evento (para calcular precio según huéspedes)
    let EVENT_PRECIOS_MAP = {};
    function buildEventosPreciosMap(eventos){
      const map = {};
      (eventos||[]).forEach(ev=>{
        const id = (ev && typeof ev.id==='object' && ev.id.S) ? ev.id.S : (ev?.id || ev?.eventoId || '');
        if (!id) return;
        // Unwrap DynamoDB format si aplica
        const evPlain = dGet(ev) || ev;
        // Moneda: raíz o dentro de precios_predefinidos
        let monedaRaw = evPlain?.precio_moneda || evPlain?.precios_predefinidos?.moneda || 'DOP';
        const moneda = String(monedaRaw).toUpperCase() === 'USD' ? 'USD' : 'DOP';
        map[id] = {
          precio: Number(evPlain?.precio || evPlain?.precio_por_persona || 0) || 0,
          precios_predefinidos: evPlain?.precios_predefinidos || null,
          moneda
        };
      });
      return map;
    }
    
    // Calcular precio de un evento según cantidad de huéspedes
    function calcularPrecioEvento(eventId, cantidadHuespedes){
      const cfg = EVENT_PRECIOS_MAP[eventId];
      if (!cfg) return 0;
      // Si tiene precios predefinidos habilitados, buscar el que corresponda
      const pp = cfg.precios_predefinidos;
      if (pp?.habilitado && Array.isArray(pp.precios) && pp.precios.length > 0){
        const cant = Number(cantidadHuespedes) || 1;
        // Buscar precio exacto por cantidad
        const exacto = pp.precios.find(p => Number(p?.cantidad) === cant);
        if (exacto) return Number(exacto.precio || 0) || 0;
        // Si no hay exacto, buscar el más cercano por arriba
        const ordenados = pp.precios.slice().sort((a,b)=> Number(a?.cantidad||0) - Number(b?.cantidad||0));
        for (const p of ordenados){
          if (Number(p?.cantidad||0) >= cant) return Number(p.precio||0) || 0;
        }
        // Si la cantidad excede, usar el último (mayor)
        return Number(ordenados[ordenados.length-1]?.precio || 0) || 0;
      }
      // Sin precios predefinidos, usar precio base
      return cfg.precio || 0;
    }

    function formatMoneda(monto, moneda) {
      const m = String(moneda || 'DOP').toUpperCase();
      const symbol = m === 'USD' ? 'US$' : 'RD$';
      return `${symbol}${Number(monto||0).toLocaleString('es-DO', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    async function withTimeout(promise, ms = 8000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('Tiempo de espera agotado')), ms))
      ]);
    }

    async function fetchJson(url, options) {
      const resp = await withTimeout(fetch(url, options));
      const data = await resp.json().catch(() => ({}));
      return { resp, data };
    }

    // ======================
    // Fetch reservas
    // ======================
    function normalizeStatus(s){
      const v = String(s||'').toLowerCase();
      if (v.startsWith('confirm')) return 'confirmado';
      if (v.startsWith('pend')) return 'pendiente';
      if (v.startsWith('canc')) return 'cancelado';
      return v || 'pendiente';
    }

    function rebuildFiltersOptions(lista){
      try{
        const yearSel = document.getElementById('yearFilter');
        if (!yearSel) return;
        const years = [...new Set(lista.map(it=> it.year).filter(Boolean))].sort((a,b)=> Number(b)-Number(a));
        const current = yearSel.value;
        yearSel.innerHTML = '<option value="">Todos los años</option>' + years.map(y=>`<option value="${y}">${y}</option>`).join('');
        if (years.includes(current)) yearSel.value = current;
      } catch(_) {}
    }

    function applyFilters(){
      const grid = document.getElementById('reservasGrid');
      if (!Array.isArray(ALL_RESERVAS)) return;
      const q = (document.getElementById('searchInput')?.value||'').toLowerCase().trim();
      const y = (document.getElementById('yearFilter')?.value||'').trim();
      const rawSt = (document.getElementById('statusFilter')?.value||'').trim();
      const st = rawSt ? normalizeStatus(rawSt) : '';
      const filtered = ALL_RESERVAS.filter(it=>{
        const name = (EVENT_NAME_MAP[it.eventId] || it.nombre || '').toLowerCase();
        const yearOk = !y || String(it.year||'') === y;
        const textOk = !q || name.includes(q);
        const stOk = !st || normalizeStatus(it.estado) === st;
        return yearOk && textOk && stOk;
      });
      if (!filtered.length){
        grid.innerHTML = '<div style="grid-column:1/-1;color:#666;padding:18px;">No hay reservas que coincidan con los filtros.</div>';
      } else {
        enrichReservasConPrecio(filtered)
          .then(enriched => enrichReservasConDetalles(enriched))
          .then((enriched2) => {
            (enriched2 || []).forEach(applyResolvedFechas);
            renderReservas(enriched2);
          });
      }
    }

    // Cache de detalles de reserva para evitar llamadas repetidas
    const __reservaDetalleCache = {};
    async function fetchReservaDetalle(registroId){
      if (!registroId) return null;
      if (__reservaDetalleCache[registroId]) return __reservaDetalleCache[registroId];
      try {
        if (!window.auth || !window.auth.isAuthenticated || !window.auth.isAuthenticated()) return null;
        const token = window.auth.getAuthToken();
        const bases = getApiBaseCandidates();
        for (const base of bases){
          try {
            const { resp, data } = await fetchJson(`${base}/api/reservas/${encodeURIComponent(registroId)}`, {
              headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!resp.ok) continue;
            const det = data?.data || data;
            __reservaDetalleCache[registroId] = det;
            return det;
          } catch(_) { continue; }
        }
      } catch(_) {}
      return null;
    }
    
    async function enrichReservasConPrecio(lista){
      const promises = lista.map(async (it) => {
        if (it.montoTotal > 0) return it; // ya tiene precio
        const key = it.registroId || it.codigoCorto || it.id;
        if (!key) return it;
        const det = await fetchReservaDetalle(key);
        if (det) {
          // Determinar cantidad de huéspedes desde varias fuentes
          const cantHuespedes = Number(
            det?.cantidadHuespedes ||
            det?.detalles?.cantidadHuespedes ||
            det?.cantHuespedes ||
            (Array.isArray(det?.huespedes) ? det.huespedes.length : 0) ||
            (Array.isArray(det?.detalles?.huespedes) ? det.detalles.huespedes.length : 0) ||
            det?.datosPersona?.cantidadHuespedes ||
            1
          ) || 1;
          
          // Intentar obtener precio del detalle primero
          let precio = Number(det?.montoTotal || det?.detalles?.precioTotal || det?.detalles?.montoTotal || det?.total || 0) || 0;
          
          // Si no hay precio en detalle, calcularlo desde el catálogo de eventos
          if (precio === 0 && it.eventId){
            precio = calcularPrecioEvento(it.eventId, cantHuespedes);
          }
          
          // Sumar tours si existen
          let tours = Number(det?.totalTours || det?.detalles?.totalTours || 0) || 0;
          if (!tours && Array.isArray(det?.tours)){
            tours = det.tours.reduce((s,t)=> s + (Number(t?.precio||0) * Number(t?.cantidad||1)), 0);
          }
          if (!tours && Array.isArray(det?.detalles?.tours)){
            tours = det.detalles.tours.reduce((s,t)=> s + (Number(t?.precio||0) * Number(t?.cantidad||1)), 0);
          }
          
          if (precio > 0) {
            it.montoTotal = precio;
            it.detalles = { ...(it.detalles||{}), ...(det?.detalles||{}) };
            if (tours > 0) it.totalTours = tours;
          }
        }
        return it;
      });
      return Promise.all(promises);
    }

    // Traer detalles frescos para flags (ej: permite_ver_comprobante_cliente) aunque ya haya precio.
    async function enrichReservasConDetalles(lista){
      const promises = (lista || []).map(async (it) => {
        try{
          const key = it?.registroId || it?.codigoCorto || it?.id;
          if (!key) return it;
          const det = await fetchReservaDetalle(key);
          if (det && det.detalles) {
            it.detalles = { ...(it.detalles||{}), ...(det?.detalles||{}) };
          }
        } catch(_) {}
        return it;
      });
      return Promise.all(promises);
    }

    async function fetchMisReservas() {
      const stateEl = document.getElementById('state');
      const grid = document.getElementById('reservasGrid');
      stateEl.style.display = 'block';
      grid.style.display = 'none';
      stateEl.innerHTML = '<div class="spinner"></div><div>Cargando tus reservas...</div>';

      try {
        if (!window.auth || !window.auth.isAuthenticated || !window.auth.isAuthenticated()) {
          stateEl.innerHTML = '<div>Redirigiendo al inicio de sesión...</div>';
          return;
        }
        const token = window.auth.getAuthToken();
        const bases = getApiBaseCandidates();
        let reservas = null;
        let lastErr = null;

        for (const base of bases) {
          try {
            let { resp, data } = await fetchJson(`${base}/api/reservas/mias`, {
              headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!resp.ok) throw new Error(data?.message || `HTTP ${resp.status}`);
            reservas = data?.data || data?.reservas || data || [];
            break;
          } catch (e) {
            lastErr = e;
            continue;
          }
        }

        if (!Array.isArray(reservas)) {
          throw lastErr || new Error('No se pudieron obtener tus reservas');
        }

        if (reservas.length === 0) {
          stateEl.innerHTML = '<div>No tienes reservas registradas aún.</div>';
          return;
        }

        const planas = reservas.map(dGet);
        const lista = planas.map(normalizeReserva);
        // Cargar catálogo de eventos para obtener la imagen por eventId
        try {
          const eventosCat = await fetchEventosCatalog();
          EVENT_IMG_MAP = buildEventosImgMap(eventosCat);
          EVENT_NAME_MAP = buildEventosNameMap(eventosCat);
          EVENT_MONEDA_MAP = buildEventosMonedaMap(eventosCat);
          EVENT_PRECIOS_MAP = buildEventosPreciosMap(eventosCat);
          EVENT_FECHAS_MAP = buildEventosFechasMap(eventosCat);
        } catch(_) {
          EVENT_IMG_MAP = {};
          EVENT_NAME_MAP = {};
          EVENT_MONEDA_MAP = {};
          EVENT_PRECIOS_MAP = {};
          EVENT_FECHAS_MAP = {};
        }
        lista.forEach(applyResolvedFechas);
        ALL_RESERVAS = lista;
        rebuildFiltersOptions(ALL_RESERVAS);
        applyFilters();
        stateEl.style.display = 'none';
        grid.style.display = 'grid';

      } catch (err) {
        console.error('Mis reservas error:', err);
        stateEl.innerHTML = `<div>Ocurrió un error cargando tus reservas. ${err.message || ''}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Listeners de filtros
      document.getElementById('searchInput')?.addEventListener('input', applyFilters);
      document.getElementById('yearFilter')?.addEventListener('change', applyFilters);
      document.getElementById('statusFilter')?.addEventListener('change', applyFilters);
      fetchMisReservas();
    });
  </script>
</body>

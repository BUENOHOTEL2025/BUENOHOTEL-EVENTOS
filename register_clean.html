<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - BuenoHotel Eventos</title>
  <style>
    .auth-container {
      max-width: 800px;
      margin: 60px auto;
      padding: 50px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-logo img {
      height: 80px;
      width: auto;
    }
    .auth-title {
      text-align: center;
      color: #222;
      margin: 30px 0 40px;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .form-row {
      display: flex;
      gap: 30px;
      margin-bottom: 30px;
    }
    .form-group {
      flex: 1;
      margin-bottom: 0;
      position: relative;
    }
    .form-group label {
      display: block;
      margin-bottom: 12px;
      color: #333;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.2px;
    }
    .form-control {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      background-color: #f9f9f9;
    }
    .form-control:focus {
      border-color: #FBB03B;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(251, 176, 59, 0.1);
      outline: none;
    }
    .btn-primary {
      background: #FBB03B;
      color: #222;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      width: auto;
      display: inline-block;
    }
    .btn-primary:hover {
      background: #e6a12c;
    }
    .error-message {
      color: #d32f2f;
      background-color: #fde7e7;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      display: none;
    }
    .success-message {
      color: #388e3c;
      background-color: #e8f5e9;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      display: none;
    }
  </style>
</head>
<body>
  <header class="main-header" style="width: 100vw; background: #FBB03B; box-shadow: 0 2px 8px rgba(0,0,0,0.07); position: relative; z-index: 10;">
    <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; min-height: 64px;">
      <div class="logo-container" style="flex:0 0 auto; display:flex; align-items:center; justify-content:flex-start;">
        <a href="index.html">
          <img src="assets/logo/logo-white.png" alt="Logo BuenoHotel" class="header-main-logo" style="height: 44px; width: auto; display: block;" />
        </a>
      </div>
      <nav class="main-nav" style="flex:1 1 auto; display:flex; justify-content:flex-end;">
        <ul style="display: flex; gap: 0; margin: 0; padding: 0; list-style: none; background: none; align-items: center;">
          <li><a href="https://ecommerce.buenohotel.com.do/" style="color: #222; background: transparent; padding: 12px 26px; border-radius: 0; font-weight: 700; font-size: 1.08rem;">Ecommerce</a></li>
          <li><a href="#servicios-section" style="color: #222; background: transparent; padding: 12px 26px; border-radius: 0; font-weight: 700; font-size: 1.08rem;">Servicios</a></li>
          <li><a href="https://tours.buenohotel.com.do/" style="color: #222; background: transparent; padding: 12px 26px; border-radius: 0; font-weight: 700; font-size: 1.08rem;">Tours</a></li>
          <li><a href="https://booking.buenohotel.com.do/" style="color: #222; background: transparent; padding: 12px 26px; border-radius: 0; font-weight: 700; font-size: 1.08rem;">Alojamientos</a></li>
          <li><a href="https://booking.buenohotel.com.do/" style="color: #222; background: transparent; padding: 12px 26px; border-radius: 0; font-weight: 700; font-size: 1.08rem;">Hoteles</a></li>
          <li><a href="https://www.buenohotel.com" style="color: #222; background: transparent; padding: 12px 26px; border-radius: 0; font-weight: 700; font-size: 1.08rem;">Conócenos</a></li>
          <li id="login-menu">
            <a href="login.html" style="color: #222; background: rgba(0,0,0,0.1); padding: 8px 20px; border-radius: 20px; font-weight: 700; font-size: 1rem; margin-left: 15px;">Iniciar Sesión</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-logo">
      <img src="assets/logo/logo-white.png" alt="BuenoHotel" style="filter: brightness(0) invert(0.1);">
    </div>
    <h1 class="auth-title">Crear Cuenta</h1>
    <h2 style="text-align: center; color: #555; margin-bottom: 30px; font-weight: 600;">Registro básico</h2>
    
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    
    <form id="register-form">
      <h3 style="color: #333; margin: 30px 0 20px; font-size: 1.4rem;">Información Personal</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="apellido">Apellido *</label>
          <input type="text" id="apellido" class="form-control" required>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="email">Correo Electrónico *</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" class="form-control" minlength="6" required>
        </div>
      </div>
      
      <h3 style="color: #333; margin: 40px 0 20px; font-size: 1.4rem;">Información de la Iglesia</h3>
      <div class="form-group">
        <label>Iglesia de procedencia *</label>
        <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;">
          <label style="display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="iglesia" value="La Romana" required> La Romana
          </label>
          <label style="display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="iglesia" value="Santiago"> Santiago
          </label>
          <label style="display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="iglesia" value="Zona Oriental"> Zona Oriental
          </label>
          <label style="display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="iglesia" value="Central Miércoles"> Central Miércoles
          </label>
          <label style="display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="iglesia" value="Región Jueves"> Región Jueves
          </label>
          <label style="display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="iglesia" value="San Juan DLM"> San Juan DLM
          </label>
          <label style="display: flex; align-items: center; gap: 5px; width: 100%; margin-top: 10px;">
            <input type="radio" name="iglesia" id="otraIglesiaRadio" value="Otra"> Otra:
            <input type="text" id="otraIglesia" class="form-control" style="flex: 1; margin-left: 10px;" disabled>
          </label>
        </div>
      </div>
      
      <!-- Información de pago y campos avanzados se pedirán en el flujo del evento -->
      
      <div class="form-group" style="text-align: center; margin-top: 40px;">
        <button type="submit" class="btn-primary">
          Completar Registro
        </button>
        <p style="margin-top: 20px; color: #666;">
          ¿Ya tienes una cuenta? <a href="login.html" style="color: #FBB03B; font-weight: 600; text-decoration: none;">Inicia sesión aquí</a>
        </p>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Elementos del DOM
      const form = document.getElementById('register-form');
      const errorMessage = document.getElementById('error-message');
      const successMessage = document.getElementById('success-message');
      const otraIglesiaRadio = document.getElementById('otraIglesiaRadio');
      const otraIglesiaInput = document.getElementById('otraIglesia');
      const iglesiaRadios = document.querySelectorAll('input[name="iglesia"]');
      const passwordInput = document.getElementById('password');

      // Habilitar/deshabilitar campo de otra iglesia
      if (otraIglesiaRadio && otraIglesiaInput) {
        otraIglesiaRadio.addEventListener('change', function() {
          otraIglesiaInput.disabled = !this.checked;
          if (this.checked) {
            otraIglesiaInput.required = true;
            otraIglesiaInput.focus();
          } else {
            otraIglesiaInput.required = false;
          }
        });
      }

      // Escuchar selección de iglesia (solo validar "Otra")
      iglesiaRadios.forEach(radio => {
        radio.addEventListener('change', function() {
          const esOtraIglesia = this.value === 'Otra';
          if (otraIglesiaInput) {
            otraIglesiaInput.disabled = !esOtraIglesia;
            otraIglesiaInput.required = esOtraIglesia;
            if (esOtraIglesia) otraIglesiaInput.focus();
          }
        });
      });

      // Validación mínima de contraseña en tiempo real
      if (passwordInput) {
        passwordInput.addEventListener('input', function() {
          if (this.value.length < 6) {
            this.setCustomValidity('La contraseña debe tener al menos 6 caracteres');
          } else {
            this.setCustomValidity('');
          }
        });
      }

      // Manejar envío del formulario
      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          // Ocultar mensajes anteriores
          if (errorMessage) errorMessage.style.display = 'none';
          if (successMessage) successMessage.style.display = 'none';
          
          // Validar que se haya seleccionado una iglesia
          const iglesiaSeleccionada = document.querySelector('input[name="iglesia"]:checked');
          if (!iglesiaSeleccionada) {
            showError('Por favor seleccione una iglesia');
            return;
          }
          
          // Si es "Otra", exigir el nombre de la iglesia
          if (iglesiaSeleccionada.value === 'Otra') {
            if (!otraIglesiaInput || !otraIglesiaInput.value.trim()) {
              showError('Por favor especifique el nombre de su iglesia');
              return;
            }
          }
          
          // Mostrar mensaje de carga
          const submitBtn = this.querySelector('button[type="submit"]');
          const originalBtnText = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML = 'Procesando...';
          
          try {
            // Simular creación de usuario (reemplazar con llamada real a la API /usuarios)
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Mostrar mensaje de éxito
            if (successMessage) {
              successMessage.textContent = '¡Cuenta creada! Ahora puedes iniciar sesión.';
              successMessage.style.display = 'block';
              successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
              
              // Limpiar el formulario
              form.reset();
              
              // Redirigir a login en 2s
              setTimeout(() => {
                window.location.href = 'login.html';
              }, 2000);
            }
            
          } catch (error) {
            console.error('Error en el registro:', error);
            showError('Ocurrió un error al procesar el registro. Por favor intente nuevamente.');
          } finally {
            // Restaurar el botón
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
          }
        });
      }
      
      // Función para mostrar mensajes de error
      function showError(message) {
        if (errorMessage) {
          errorMessage.textContent = message;
          errorMessage.style.display = 'block';
          errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          alert(message);
        }
      }
    });
  </script>
</body>
</html>
